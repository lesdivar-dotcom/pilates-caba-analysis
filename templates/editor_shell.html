<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Observatorio Pilates Transverso</title>

<style>

html,body{

margin:0;
height:100%;
overflow:hidden;

font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;

background:#F7F9FB;

}

iframe{

border:none;

width:100%;
height:100%;

display:block;

}

/* ---------------------------------------------------------- */
/* Botón Editorial */
/* ---------------------------------------------------------- */

#toggle{

position:fixed;

top:26px;
right:26px;

z-index:1100;

background:#8B0000;

color:white;

border:none;

padding:12px 18px;

border-radius:10px;

cursor:pointer;

font-weight:600;

box-shadow:0 8px 20px rgba(0,0,0,.18);

transition:.25s;

}

#toggle:hover{

background:#A30000;

}

/* ---------------------------------------------------------- */
/* Panel lateral */
/* ---------------------------------------------------------- */

#editor-panel{

position:fixed;

top:0;
right:-390px;

width:390px;
height:100%;

background:#220000;

color:white;

transition:right .35s ease;

box-shadow:-18px 0 35px rgba(0,0,0,.28);

z-index:1000;

display:flex;

flex-direction:column;

}

#editor-panel.abierto{

right:0;

}

.panel-header{

padding:24px;

border-bottom:1px solid rgba(255,255,255,.12);

}

.panel-header h2{

margin:0;

font-size:24px;

}

.panel-header p{

margin:8px 0 0;

font-size:13px;

opacity:.82;

}

.panel-body{

padding:22px;

overflow:auto;

flex:1;

}

label{

display:block;

margin-top:16px;

font-size:13px;

font-weight:600;

}

input,
select,
textarea{

width:100%;

padding:11px;

border:none;

border-radius:8px;

margin-top:6px;

box-sizing:border-box;

font-size:14px;

}

textarea{

resize:vertical;

min-height:90px;

}

.estado{

margin-top:20px;

padding:16px;

background:#3A1010;

border-left:4px solid #A30000;

border-radius:10px;

font-size:14px;

line-height:1.6;

}

.botones{

display:flex;

gap:10px;

margin-top:22px;

}

.btn{

flex:1;

padding:12px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:600;

font-size:14px;

transition:.2s;

}

.validar{

background:#8B0000;

color:white;

}

.validar:hover{

background:#A30000;

}

.guardar{

background:#050505;

color:white;

}

.guardar:hover{

background:#222;

}

.codigo{

margin-top:18px;

font-size:12px;

opacity:.72;

line-height:1.7;

}

</style>

</head>

<body>

<button id="toggle">

Editorial

</button>

<iframe src="/dashboard"></iframe>

<aside id="editor-panel">

<div class="panel-header">

<h2>

Incorporar un estudio

</h2>

<p>

Editor local del Observatorio Transverso

</p>

</div>

<div class="panel-body">

<label>Nombre del estudio</label>
<input id="nombre">

<label>Dirección</label>
<input id="direccion">

<label>Barrio</label>
<select id="barrio"></select>

<label>Teléfono</label>
<input id="telefono">

<label>Email</label>
<input id="email">

<label>Instagram</label>
<input id="instagram">

<label>Web</label>
<input id="web">

<label>Fabricante del reformer</label>

<select id="fabricante">

<option>Balanced Body</option>
<option>Merrithew</option>
<option>Peak Pilates</option>
<option>Gratz</option>
<option>Diseño de autor</option>

</select>

<label>Observaciones</label>

<textarea id="observaciones"></textarea>

<div class="estado" id="estado">

Esperando validación editorial.

</div>

<div class="botones">

<button class="btn validar" id="btnValidar">

Validar

</button>

<button class="btn guardar" id="btnGuardar">

Guardar borrador

</button>

</div>

<div class="codigo">

Motor 7.4 · Editorial Web

</div>

</div>

</aside>

<script>

/* ---------------------------------------------------------- */
/* Panel */
/* ---------------------------------------------------------- */

const panel=document.getElementById("editor-panel");

document.getElementById("toggle").onclick=()=>{

panel.classList.toggle("abierto");

};

/* ---------------------------------------------------------- */
/* Barrios oficiales */
/* ---------------------------------------------------------- */

const barrios=[

"Agronomía","Almagro","Balvanera","Barracas","Belgrano","Boedo",

"Caballito","Chacarita","Coghlan","Colegiales","Constitución",

"Flores","Floresta","La Boca","La Paternal","Liniers","Mataderos",

"Monte Castro","Monserrat","Nueva Pompeya","Núñez","Palermo",

"Parque Avellaneda","Parque Chacabuco","Parque Chas","Parque Patricios",

"Puerto Madero","Recoleta","Retiro","Saavedra","San Cristóbal",

"San Nicolás","San Telmo","Vélez Sarsfield","Versalles",

"Villa Crespo","Villa del Parque","Villa Devoto","Villa General Mitre",

"Villa Lugano","Villa Luro","Villa Ortúzar","Villa Pueyrredón",

"Villa Real","Villa Riachuelo","Villa Santa Rita","Villa Soldati",

"Villa Urquiza"

];

const select=document.getElementById("barrio");

barrios.forEach(b=>{

const o=document.createElement("option");

o.value=b;

o.textContent=b;

select.appendChild(o);

});

/* ---------------------------------------------------------- */
/* Botones (Entrega 2 conectará API) */
/* ---------------------------------------------------------- */

document.getElementById("btnValidar").onclick=()=>{

document.getElementById("estado").innerHTML=

"<b>Motor 7.4</b><br>La validación en tiempo real llegará en la Entrega 2.";

};

document.getElementById("btnGuardar").onclick=()=>{

document.getElementById("estado").innerHTML=

"<b>Motor 7.4</b><br>El guardado de Draft llegará en la Entrega 3.";

};

</script>

</body>

</html>
